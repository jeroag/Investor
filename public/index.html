<!doctype html>
<html lang="es">

<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CryptoPlan IA — Terminal</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- Loading screen -->
  <div id="loading-screen">
    <h1>Crypto<b>Plan</b> <small>AI</small></h1>
    <p><span class="spinner"></span> Iniciando terminal...</p>
  </div>

  <!-- Header -->
  <header class="hdr">
    <div class="hdr-inner">
      <div class="hdr-left" style="display:flex;align-items:center;gap:10px">
        <div class="logo">Crypto<b>Plan</b></div>
        <div id="session-badge" class="session-badge">
          <span class="sb-dot"></span>
          <span style="font-family:var(--font-mono);font-size:9px;font-weight:600;letter-spacing:.5px">NY</span>
        </div>
        <div class="ws-status">
          <span class="ws-dot connecting" id="ws-dot-ref"></span>
          <span id="ws-label"
            style="color:var(--yellow);font-family:var(--font-mono);font-size:9px;letter-spacing:.5px">CONECTANDO</span>
        </div>
      </div>
      <div class="hdr-right">
        <button id="scanner-toggle-hdr" class="scanner-btn off">📡 ESCÁNER</button>
        <button id="btn-gen" class="btn-main" disabled><span style="font-size:12px">⚡</span> ANALIZAR</button>
        <button id="sound-toggle-btn" onclick="toggleSound()" title="Sonido" class="dark-toggle">🔔</button>
        <button class="dark-toggle" id="dark-toggle" onclick="toggleDarkMode()" title="Modo oscuro/claro">🌙</button>
        <button class="btn-logout" onclick="doLogout()" title="Salir"><span>🔒</span></button>
      </div>
    </div>
    <!-- Ticker de precios -->
    <div id="hdr-ticker">
      <span
        style="font-size:8px;letter-spacing:1.5px;color:var(--subtle);font-weight:600;text-transform:uppercase;margin-right:4px">LIVE</span>
    </div>
  </header>

  <!-- Balance widget (hidden in new design, data shown in dashboard) -->
  <div id="balance-widget" style="display:none"></div>

  <div class="layout">
    <div class="side-backdrop" id="side-backdrop"></div>

    <!-- Sidebar — icon + micro label -->
    <nav class="side" id="sidebar">
      <button class="nb" data-tab="dash">
        <span class="nb-icon">◈</span><span class="nb-text">DASH</span>
      </button>
      <button class="nb" data-tab="ops">
        <span class="nb-icon">◎</span><span class="nb-text">OPS</span>
        <span class="nb-badge" id="alert-badge"
          style="display:none;position:absolute;top:4px;right:4px;font-size:7px;padding:1px 3px">0</span>
      </button>
      <button class="nb" data-tab="alerts">
        <span class="nb-icon">◬</span><span class="nb-text">SCAN</span>
      </button>
      <button class="nb" data-tab="mkt">
        <span class="nb-icon">◧</span><span class="nb-text">MKT</span>
      </button>
      <div class="nb-div"></div>
      <button class="nb" data-tab="diary">
        <span class="nb-icon">▤</span><span class="nb-text">DIARY</span>
      </button>
      <button class="nb" data-tab="historial">
        <span class="nb-icon">▦</span><span class="nb-text">HIST</span>
      </button>
      <button class="nb" data-tab="backtest">
        <span class="nb-icon">⊞</span><span class="nb-text">TEST</span>
      </button>
      <button class="nb" data-tab="strat">
        <span class="nb-icon">◉</span><span class="nb-text">STRAT</span>
      </button>
      <button class="nb" data-tab="goals">
        <span class="nb-icon">◎</span><span class="nb-text">GOALS</span>
      </button>
      <div class="nb-div"></div>
      <button class="nb" data-tab="config">
        <span class="nb-icon">⊙</span><span class="nb-text">CFG</span>
      </button>
    </nav>

    <!-- Main content -->
    <main class="cnt" style="height:calc(100vh - var(--hdr-h))">
      <div id="sec-dash" class="sec on"></div>
      <div id="sec-ops" class="sec"></div>
      <div id="sec-alerts" class="sec"></div>
      <div id="sec-mkt" class="sec"></div>
      <div id="sec-diary" class="sec"></div>
      <div id="sec-historial" class="sec"></div>
      <div id="sec-backtest" class="sec"></div>
      <div id="sec-strat" class="sec"></div>
      <div id="sec-goals" class="sec"></div>
      <div id="sec-config" class="sec"></div>
    </main>
  </div>

  <!-- Scanner sweep FX -->
  <div id="scanner-sweep"></div>

  <!-- External libraries -->
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- App scripts — order matters -->
  <script src="js/core.js" defer></script>
  <script src="js/indicators.js" defer></script>
  <script src="js/network.js" defer></script>
  <script src="js/claude.js" defer></script>
  <script src="js/bitunix.js" defer></script>
  <script src="js/trading.js" defer></script>
  <script src="js/strategy.js" defer></script><!-- sobreescribe buildTrade, calcProposalMoney -->
  <script src="js/ui-market.js" defer></script>
  <script src="js/ui-ops.js" defer></script>
  <script src="js/ui-analysis.js" defer></script>
  <script src="js/ui-config.js" defer></script>
  <script src="js/backtester.js" defer></script>
  <script src="js/app-init.js" defer></script>

  <!-- Sidebar toggle (no deps needed, runs immediately) -->
  <script>
    const _toggle = document.getElementById('menu-toggle');
    const _sidebar = document.getElementById('sidebar');
    const _backdrop = document.getElementById('side-backdrop');
    const _open = () => { _sidebar.classList.add('open'); _backdrop.classList.add('open'); };
    const _close = () => { _sidebar.classList.remove('open'); _backdrop.classList.remove('open'); };
    _toggle.addEventListener('click', () => _sidebar.classList.contains('open') ? _close() : _open());
    _backdrop.addEventListener('click', _close);
    document.querySelectorAll('.nb').forEach(b => b.addEventListener('click', _close));
  </script>
</body>

</html>
