<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CryptoPlan IA — Terminal</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- Loading screen -->
  <div id="loading-screen">
    <h1>Crypto<b>Plan</b> <small>AI</small></h1>
    <p><span class="spinner"></span> Iniciando terminal...</p>
  </div>

  <!-- Header -->
  <header class="hdr">
    <div class="hdr-left">
      <button class="menu-toggle" id="menu-toggle" aria-label="Menú">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="7" x2="21" y2="7" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="17" x2="21" y2="17" />
        </svg>
      </button>

      <div class="logo">Crypto<b>Plan</b> <small>AI</small></div>

      <!-- Session badge — updated by strategy.js -->
      <div id="session-badge" class="session-badge">
        <span class="sb-dot"></span>
        <span style="font-family:var(--font-mono);font-size:9px;font-weight:600;letter-spacing:.5px">NY SESSION</span>
      </div>
    </div>

    <div class="hdr-right">
      <!-- WS status -->
      <div class="ws-status">
        <span class="ws-dot connecting" id="ws-dot-ref"></span>
        <span id="ws-label"
          style="color:var(--yellow);font-family:var(--font-mono);font-size:9px;letter-spacing:.5px">CONECTANDO</span>
      </div>

      <!-- Scanner toggle -->
      <button id="scanner-toggle-hdr" class="scanner-btn off">📡 ESCÁNER</button>

      <!-- Analyze -->
      <button id="btn-gen" class="btn-main" disabled>
        <span style="font-size:12px">⚡</span> ANALIZAR
      </button>

      <!-- Dark mode -->
      <button class="dark-toggle" id="dark-toggle" onclick="toggleDarkMode()" title="Modo oscuro / claro">🌙</button>

      <!-- Logout -->
      <button class="btn-logout" onclick="doLogout()" title="Cerrar sesión">
        <span>🔒</span> SALIR
      </button>
    </div>
  </header>

  <!-- Balance / equity widget -->
  <div id="balance-widget"></div>

  <div class="layout">
    <div class="side-backdrop" id="side-backdrop"></div>

    <!-- Sidebar navigation -->
    <nav class="side" id="sidebar">

      <button class="nb" data-tab="dash">🏠 Inicio</button>

      <div class="ns">Trading</div>
      <button class="nb" data-tab="ops">
        📊 Operaciones
      </button>
      <button class="nb" data-tab="alerts">
        🔔 Alertas IA
        <span class="nb-badge" id="alert-badge" style="display:none">0</span>
      </button>
      <button class="nb" data-tab="mkt">🌐 Mercado</button>

      <div class="ns">Análisis</div>
      <button class="nb" data-tab="diary">📓 Diario</button>
      <button class="nb" data-tab="historial">📈 Historial</button>
      <button class="nb" data-tab="strat">🧠 Estrategia IA</button>
      <button class="nb" data-tab="goals">🎯 Objetivos</button>

      <div class="ns">Ajustes</div>
      <button class="nb" data-tab="config">⚙️ Configuración</button>

      <!-- Scanner active indicator -->
      <div class="scanner-mini" id="scanner-mini" style="display:none">
        <div class="scanner-mini-title">
          <span class="scanner-mini-dot"></span> Escáner activo
        </div>
        <div style="color:var(--muted);font-size:10px;margin-top:3px" id="scanner-mini-time"></div>
      </div>
    </nav>

    <!-- Main content -->
    <main class="cnt" style="height:calc(100vh - var(--hdr-h) - var(--bal-h, 46px))">
      <div id="sec-dash" class="sec on"></div>
      <div id="sec-ops" class="sec"></div>
      <div id="sec-alerts" class="sec"></div>
      <div id="sec-mkt" class="sec"></div>
      <div id="sec-diary" class="sec"></div>
      <div id="sec-historial" class="sec"></div>
      <div id="sec-strat" class="sec"></div>
      <div id="sec-goals" class="sec"></div>
      <div id="sec-config" class="sec"></div>
    </main>
  </div>

  <!-- Scanner sweep FX -->
  <div id="scanner-sweep"></div>

  <!-- External libraries -->
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- App scripts — order matters -->
  <script src="js/core.js" defer></script>
  <script src="js/indicators.js" defer></script>
  <script src="js/network.js" defer></script>
  <script src="js/claude.js" defer></script>
  <script src="js/bitunix.js" defer></script>
  <script src="js/trading.js" defer></script>
  <script src="js/strategy.js" defer></script><!-- sobreescribe buildTrade, calcProposalMoney -->
  <script src="js/ui-market.js" defer></script>
  <script src="js/ui-ops.js" defer></script>
  <script src="js/ui-analysis.js" defer></script>
  <script src="js/ui-config.js" defer></script>
  <script src="js/app-init.js" defer></script>

  <!-- Sidebar toggle (no deps needed, runs immediately) -->
  <script>
    const _toggle = document.getElementById('menu-toggle');
    const _sidebar = document.getElementById('sidebar');
    const _backdrop = document.getElementById('side-backdrop');
    const _open = () => { _sidebar.classList.add('open'); _backdrop.classList.add('open'); };
    const _close = () => { _sidebar.classList.remove('open'); _backdrop.classList.remove('open'); };
    _toggle.addEventListener('click', () => _sidebar.classList.contains('open') ? _close() : _open());
    _backdrop.addEventListener('click', _close);
    document.querySelectorAll('.nb').forEach(b => b.addEventListener('click', _close));
  </script>
</body>

</html>
