<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>CryptoPlan IA — Acceso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500&family=Space+Grotesk:wght@300;400&display=swap" />

  <link rel="preload" href="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"
    as="script">
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/chart.js" as="script">
  <link rel="preload" href="/js/core.js" as="script">
  <link rel="preload" href="/js/network.js" as="script">
  <link rel="preload" href="/js/app-init.js" as="script">

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #070707;
      color: #888;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes shake {

      0%,
      100% {
        transform: none;
      }

      20%,
      60% {
        transform: translateX(-5px);
      }

      40%,
      80% {
        transform: translateX(5px);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .wrap {
      width: 100%;
      max-width: 340px;
      animation: fadeUp .35s ease;
    }

    /* Logo */
    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #E0E0E0;
      margin-bottom: 6px;
    }

    .logo span {
      color: #2A2A2A;
    }

    .tagline {
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #2A2A2A;
      font-weight: 500;
      margin-bottom: 40px;
    }

    /* Form card */
    .card {
      background: #0A0A0A;
      border: 1px solid #1A1A1A;
      border-radius: 6px;
      padding: 28px 24px;
    }

    label {
      display: block;
      font-size: 7px;
      font-weight: 600;
      color: #383838;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .inp-wrap {
      position: relative;
      margin-bottom: 20px;
    }

    input[type=password],
    input[type=text] {
      width: 100%;
      background: #070707;
      border: 1px solid #1A1A1A;
      border-radius: 4px;
      padding: 11px 40px 11px 13px;
      color: #C0C0C0;
      font-family: 'Space Grotesk', monospace;
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 2px;
      outline: none;
      transition: border-color .15s;
    }

    input:focus {
      border-color: #383838;
    }

    input::placeholder {
      color: #252525;
      letter-spacing: 3px;
    }

    .eye-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #2A2A2A;
      font-size: 14px;
      line-height: 1;
      transition: color .15s;
    }

    .eye-btn:hover {
      color: #555;
    }

    .btn-login {
      width: 100%;
      background: transparent;
      color: #888;
      border: 1px solid #242424;
      border-radius: 4px;
      padding: 11px;
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover:not(:disabled) {
      border-color: #383838;
      color: #C0C0C0;
    }

    .btn-login:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .btn-login.success {
      border-color: rgba(106, 191, 122, .3);
      color: #6ABF7A;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 1.5px solid #282828;
      border-top-color: #686868;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: inline-block;
    }

    .error-msg {
      background: rgba(138, 58, 58, .1);
      border: 1px solid rgba(138, 58, 58, .25);
      color: #A06060;
      border-radius: 4px;
      padding: 9px 12px;
      font-size: 11px;
      margin-top: 12px;
      display: none;
      line-height: 1.5;
    }

    .error-msg.show {
      display: block;
      animation: shake .35s ease;
    }

    .attempts {
      font-size: 9px;
      color: #6A3A3A;
      text-align: center;
      margin-top: 8px;
      letter-spacing: 1px;
      display: none;
    }

    /* Footer */
    .footer {
      margin-top: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 9px;
      color: #222;
      letter-spacing: 0.5px;
    }

    .footer-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #1E1E1E;
      flex-shrink: 0;
    }

    /* Version */
    .version {
      margin-top: 32px;
      font-size: 8px;
      letter-spacing: 2px;
      color: #1A1A1A;
      text-align: center;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="logo">CRYPTO<span>PLAN</span></div>
    <div class="tagline">Terminal de trading · Acceso restringido</div>

    <div class="card">
      <label for="pwd">Clave de acceso</label>
      <div class="inp-wrap">
        <input type="password" id="pwd" placeholder="············" autocomplete="current-password" autofocus />
        <button class="eye-btn" id="eye" type="button" onclick="toggleEye()" title="Ver">👁</button>
      </div>
      <button class="btn-login" id="login-btn" onclick="doLogin()">
        <span id="btn-text">ENTRAR</span>
      </button>
      <div class="error-msg" id="error-msg"></div>
      <div class="attempts" id="attempts-msg"></div>
    </div>

    <div class="footer">
      <div class="footer-dot"></div>
      <span>Conexión segura · Sesión 12h · Claves en servidor</span>
    </div>

    <div class="version">CRYPTOPLAN IA · v2.0</div>

  </div>

  <script>
    let attempts = 0;
    let blocked = false;

    document.getElementById('pwd').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    function toggleEye() {
      const inp = document.getElementById('pwd');
      const eye = document.getElementById('eye');
      if (inp.type === 'password') { inp.type = 'text'; eye.textContent = '🙈'; }
      else { inp.type = 'password'; eye.textContent = '👁'; }
    }

    async function doLogin() {
      if (blocked) return;
      const password = document.getElementById('pwd').value;
      if (!password) { showError('Introduce tu contraseña.'); return; }

      const btn = document.getElementById('login-btn');
      const text = document.getElementById('btn-text');
      btn.disabled = true;
      text.innerHTML = '<span class="spinner"></span>';
      hideError();

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        const data = await res.json();

        if (data.ok) {
          sessionStorage.setItem('cp_token', data.token);
          btn.classList.add('success');
          text.textContent = '✓ ACCESO CORRECTO';
          setTimeout(() => { window.location.href = '/'; }, 500);
        } else {
          attempts++;
          showError(data.error || 'Contraseña incorrecta.');
          document.getElementById('pwd').value = '';
          document.getElementById('pwd').focus();

          if (attempts >= 5) {
            blocked = true;
            let t = 60;
            showError('Demasiados intentos. Espera 60 segundos.');
            const interval = setInterval(() => {
              t--;
              const el = document.getElementById('attempts-msg');
              el.style.display = 'block';
              el.textContent = `BLOQUEADO · ${t}s`;
              if (t <= 0) {
                clearInterval(interval);
                blocked = false; attempts = 0;
                el.style.display = 'none';
                hideError();
              }
            }, 1000);
          }
          btn.disabled = false;
          text.textContent = 'ENTRAR';
        }
      } catch (e) {
        showError('Error de conexión. Inténtalo de nuevo.');
        btn.disabled = false;
        text.textContent = 'ENTRAR';
      }
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.add('show');
      el.style.animation = 'none';
      el.offsetHeight;
      el.style.animation = '';
    }
    function hideError() {
      document.getElementById('error-msg').classList.remove('show');
    }
  </script>
</body>

</html>
